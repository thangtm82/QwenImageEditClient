name: Build WinForms

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
      - name: Restore packages
        run: nuget restore QwenImageEditClient.sln
      - name: Build Release
        run: msbuild QwenImageEditClient.sln /p:Configuration=Release /p:Platform="Any CPU" /p:RestorePackages=false
